<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elétrica — Painel de Tarefas</title>
<meta name="theme-color" content="#C97A18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elétrica">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F6;
  --panel:#FFFFFF;
  --panel-alt:#EEF1F3;
  --border:#D9E0E4;
  --border-soft:#E7ECEE;
  --amber:#C97A18;
  --amber-dim:#E0A24A;
  --green:#1E9A5D;
  --red:#D14A3B;
  --cyan:#1C7FA3;
  --text:#1C262B;
  --text-dim:#5B6B73;
  --text-mute:#8A9AA2;
  --on-accent:#231604;
  --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background-image:
    linear-gradient(var(--border-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size:34px 34px;
  background-attachment:fixed;
}
h1,h2,h3,.disp{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:'Inter',sans-serif; cursor:pointer;}
::selection{background:var(--amber); color:#fff;}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:420px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:32px 30px 28px;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(28,38,43,.08);
}
.login-card::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:4px;
  background:repeating-linear-gradient(135deg, var(--amber) 0 10px, #1C262B 10px 20px);
}
.login-brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.bolt{color:var(--amber); font-size:26px; line-height:1;}
.login-brand h1{font-size:22px; margin:0; color:var(--text);}
.login-sub{color:var(--text-dim); font-size:13px; margin:0 0 24px; letter-spacing:.03em; text-transform:uppercase;}
.tabs{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:22px;}
.tab-btn{
  flex:1; padding:10px 8px; background:var(--panel-alt); color:var(--text-dim);
  border:none; font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  transition:.15s;
}
.tab-btn.active{background:var(--amber); color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
.field input, .field select{
  width:100%; padding:11px 12px; background:var(--bg); border:1px solid var(--border);
  border-radius:6px; color:var(--text); font-size:14px; font-family:'IBM Plex Mono',monospace;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--amber);}
.btn-primary{
  width:100%; padding:12px; border:none; border-radius:6px; background:var(--amber); color:#fff;
  font-weight:700; font-size:14px; letter-spacing:.03em; text-transform:uppercase; margin-top:6px;
}
.btn-primary:hover{filter:brightness(1.08);}
.login-error{color:var(--red); font-size:12.5px; margin-top:10px; display:none;}
.login-hint{font-size:11.5px; color:var(--text-mute); margin-top:18px; line-height:1.5; border-top:1px dashed var(--border); padding-top:14px;}

/* ---------- APP SHELL ---------- */
#app-screen{display:none; min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
  padding:20px 14px; display:flex; flex-direction:column;
}
.sidebar-brand{display:flex; align-items:center; gap:8px; padding:0 6px 20px; border-bottom:1px solid var(--border); margin-bottom:16px;}
.sidebar-brand .bolt{font-size:20px;}
.sidebar-brand span{font-size:15px; font-weight:700; font-family:'Rajdhani',sans-serif;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; color:var(--text-dim);
  font-size:13.5px; font-weight:600; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:var(--panel-alt); color:var(--text);}
.nav-item.active{background:var(--panel-alt); color:var(--amber); box-shadow:inset 3px 0 0 var(--amber);}
.sidebar-head{padding-bottom:14px; margin-bottom:12px; border-bottom:1px solid var(--border);}
.profile-card{display:flex; align-items:center; gap:10px; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px; padding:9px 10px;}
.profile-avatar{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(145deg,var(--amber),#9a6414); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px;
}
.profile-info{flex:1; min-width:0;}
.profile-info b{display:block; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.3;}
.profile-info span{display:block; font-size:11px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.profile-logout{
  width:28px; height:28px; flex-shrink:0; border-radius:6px; border:1px solid var(--border);
  background:var(--panel); color:var(--text-dim); font-size:14px; display:flex; align-items:center; justify-content:center;
}
.profile-logout:hover{color:var(--red); border-color:var(--red); background:rgba(209,74,59,.08);}
.version-tag{text-align:center; margin-top:8px; font-size:10px; color:var(--text-mute);}

.main{flex:1; padding:26px 32px 60px; min-width:0;}
.main-header{display:flex; align-items:center; margin-bottom:16px;}
.topbar-logout{
  margin-left:auto; display:flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:20px; border:1px solid var(--border);
  background:var(--panel); color:var(--text-dim); font-size:12.5px; font-weight:600;
}
.topbar-logout:hover{color:var(--red); border-color:var(--red); background:rgba(209,74,59,.08);}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.topbar h2{margin:0; font-size:24px;}
.topbar .badge-today{font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; border:1px solid var(--border); padding:5px 10px; border-radius:20px;}

.grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:26px;}
.stat-card{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px 18px; position:relative; overflow:hidden;}
.stat-card .n{font-family:'Rajdhani',sans-serif; font-size:32px; font-weight:700; line-height:1;}
.stat-card .l{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:6px;}
.stat-card.amber .n{color:var(--amber);}
.stat-card.green .n{color:var(--green);}
.stat-card.red .n{color:var(--red);}
.stat-card.cyan .n{color:var(--cyan);}

.panel-box{background:var(--panel); border:1px solid var(--border); border-radius:8px; margin-bottom:22px; overflow:hidden;}
.panel-box .pb-head{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.panel-box .pb-head h3{margin:0; font-size:16px;}
.panel-box .pb-head p{margin:2px 0 0; font-size:12px; color:var(--text-dim);}
.pb-body{padding:6px 0; overflow-x:auto;}

table{width:100%; min-width:560px; border-collapse:collapse; font-size:13px;}
th{text-align:left; padding:9px 18px; color:var(--text-mute); font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border); font-weight:600;}
td{padding:11px 18px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,0,0,.02);}
.os-tag{font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-size:12px;}
.desc-cell{max-width:420px; color:var(--text);}

.status-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.status-pendente{background:rgba(91,107,115,.14); color:var(--text-dim);}
.status-atribuida{background:rgba(28,127,163,.14); color:var(--cyan);}
.status-aguardando_aprovacao{background:rgba(201,122,24,.14); color:var(--amber);}
.status-concluida{background:rgba(30,154,93,.14); color:var(--green);}
.status-atrasada{background:repeating-linear-gradient(135deg, rgba(209,74,59,.16) 0 6px, rgba(209,74,59,.05) 6px 12px); color:var(--red);}

.mini-select, .mini-input{
  background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:12.5px;
  padding:6px 8px; border-radius:5px; font-family:'IBM Plex Mono',monospace;
}
input[type="date"]{
  color-scheme:light;
  cursor:pointer;
}
input[type="date"]::-webkit-calendar-picker-indicator{
  filter:invert(40%) sepia(60%) saturate(900%) hue-rotate(1deg) brightness(0.95);
  cursor:pointer;
  padding:2px;
}
input[type="date"]:hover{border-color:var(--amber);}
.mini-select option:disabled{color:var(--text-mute);}
.btn-sm{padding:7px 13px; border-radius:5px; border:1px solid var(--amber); background:transparent; color:var(--amber); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.btn-sm:hover{background:var(--amber); color:#fff;}
.btn-sm:disabled{opacity:.35; cursor:not-allowed; border-color:var(--border); color:var(--text-mute);}
.btn-sm.green{border-color:var(--green); color:var(--green);}
.btn-sm.green:hover{background:var(--green); color:#fff;}
.btn-sm.red{border-color:var(--red); color:var(--red);}
.btn-sm.red:hover{background:var(--red); color:#fff;}
.assign-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.field-row label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}

.empty-state{padding:34px 18px; text-align:center; color:var(--text-mute); font-size:13px;}

/* rank hex badge */
.hex{
  width:52px; height:52px; position:relative;
  clip-path:polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px;
}
.hex-1{background:linear-gradient(145deg,#8896A0,#5C6B73); color:#F4F6F7;}
.hex-2{background:linear-gradient(145deg,#6FC08A,#3C9463); color:#F0FFF6;}
.hex-3{background:linear-gradient(145deg,#4FA97A,#1E7A50); color:#F0FFF6;}
.hex-4{background:linear-gradient(145deg,#2E8F62,#145C3B); color:#EFFFF6;}
.hex-5{background:linear-gradient(145deg,#5FBBDD,#2D8CB0); color:#EEFAFF;}
.hex-6{background:linear-gradient(145deg,#3F9FC4,#1C6E8C); color:#EEFAFF;}
.hex-7{background:linear-gradient(145deg,#2A7996,#114F66); color:#EAFAFF;}
.hex-8{background:linear-gradient(145deg,#EAB56E,#C88A32); color:#FFF6E8;}
.hex-9{background:linear-gradient(145deg,#E0A24A,#B87418); color:#FFF6E8;}
.hex-10{background:linear-gradient(145deg,#C9791A,#8F5410); color:#FFF6E8;}
.hex-11{background:linear-gradient(145deg,#F0C86A,#C9791A); color:#FFFBEF;}
.hex-12{background:linear-gradient(145deg,#FFD988,#B8791E); color:#3A2205;}

.rank-row{display:flex; align-items:center; gap:16px;}
.rank-info b{font-size:20px; font-family:'Rajdhani',sans-serif; display:block;}
.rank-info span{font-size:12px; color:var(--text-dim);}
.progress-bar{background:var(--bg); border:1px solid var(--border); border-radius:20px; height:9px; width:220px; overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--amber),#c98a2e);}

.task-card{border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-bottom:12px; background:var(--panel);}
.task-card .tc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px;}
.task-card .tc-desc{font-size:14px; line-height:1.45; color:var(--text); margin:0 0 8px;}
.task-card .tc-meta{display:flex; gap:16px; font-size:12px; color:var(--text-dim); flex-wrap:wrap;}
.task-card .tc-meta b{color:var(--text);}
.task-card .tc-foot{display:flex; justify-content:flex-end; margin-top:10px;}

.cal-wrap{overflow-x:auto;}
.month-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.month-tab{padding:7px 13px; border-radius:20px; border:1px solid var(--border); background:var(--panel); color:var(--text-dim); font-size:12px; font-weight:600;}
.month-tab:hover{border-color:var(--amber); color:var(--text);}
.month-tab.active{background:var(--amber); border-color:var(--amber); color:#fff;}
.cal-table th, .cal-table td{padding:6px 8px; text-align:center; font-size:11px;}
.cal-table th.day-h{color:var(--text-mute); font-weight:500;}
.cal-table td.name-c{text-align:left; font-family:'Inter'; font-size:12.5px; color:var(--text); white-space:nowrap; padding-right:16px;}
.f-cell{color:var(--amber); font-weight:700; background:rgba(201,122,24,.10);}

.toast-wrap{position:fixed; top:20px; right:20px; z-index:50; display:flex; flex-direction:column; gap:8px;}
.toast{
  padding:12px 16px; border-radius:7px; background:var(--panel); border:1px solid var(--border);
  font-size:13px; min-width:220px; box-shadow:0 8px 22px rgba(28,38,43,.14);
  animation:slidein .25s ease-out;
}
.toast.pos{border-left:3px solid var(--green);}
.toast.neg{border-left:3px solid var(--red);}
@keyframes slidein{from{transform:translateX(14px); opacity:0;} to{transform:translateX(0); opacity:1;}}

.img-modal-backdrop{position:fixed; inset:0; background:rgba(28,38,43,.6); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;}
.img-modal{background:var(--panel); border-radius:10px; max-width:480px; width:100%; max-height:90vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.35);}
.img-modal-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border);}
.img-modal-head b{font-family:'Rajdhani',sans-serif; font-size:15px;}
.img-modal-close{background:none; border:none; font-size:15px; color:var(--text-dim); cursor:pointer; width:30px; height:30px; border-radius:6px;}
.img-modal-close:hover{background:var(--panel-alt); color:var(--red);}
.img-modal-body{overflow:auto; padding:14px; text-align:center; background:var(--panel-alt);}
.img-modal-body img{max-width:100%; height:auto; border:1px solid var(--border); border-radius:4px; display:block; margin:0 auto;}
.img-modal-foot{padding:14px 16px; border-top:1px solid var(--border);}
.img-modal-download{display:block; width:100%; padding:12px; border:none; border-radius:6px; background:var(--amber); color:#fff; font-weight:700; font-size:14px; letter-spacing:.03em; text-transform:uppercase; text-align:center; text-decoration:none;}
.img-modal-download:hover{filter:brightness(1.08);}

.leader-row{display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border-soft);}
.leader-row:last-child{border-bottom:none;}
.leader-pos{font-family:'IBM Plex Mono',monospace; color:var(--text-mute); width:22px;}
.leader-name{flex:1; font-size:13.5px;}
.leader-pts{font-family:'IBM Plex Mono',monospace; color:var(--amber); font-weight:600;}
.leader-row.me{background:rgba(201,122,24,.08);}

.notice{background:var(--panel-alt); border:1px solid var(--border); border-left:3px solid var(--cyan); border-radius:6px; padding:12px 16px; font-size:12.5px; color:var(--text-dim); margin-bottom:20px; line-height:1.5;}

.prog-banner{display:flex; align-items:center; justify-content:space-between; gap:16px; background:linear-gradient(120deg, var(--amber), #b8741c); color:#fff; border-radius:8px; padding:16px 20px; margin-bottom:20px; flex-wrap:wrap;}
.prog-banner-brand{display:flex; align-items:center; gap:12px;}
.prog-banner-brand .bolt{font-size:28px; line-height:1;}
.prog-banner-brand b{display:block; font-size:15px; font-family:'Rajdhani',sans-serif; letter-spacing:.02em;}
.prog-banner-brand span{display:block; font-size:12.5px; opacity:.92; margin-top:3px;}
.prog-banner-nav{display:flex; align-items:center; gap:8px;}
.prog-banner-nav .btn-sm{border-color:#fff; color:#fff; padding:7px 11px;}
.prog-banner-nav .btn-sm:hover{background:#fff; color:var(--amber);}
.prog-banner-nav input[type="date"]{background:#fff;}
tr.turno-divider td{background:var(--panel-alt); font-weight:700; font-family:'Rajdhani',sans-serif; font-size:14px; letter-spacing:.04em; color:var(--amber); padding-top:10px; padding-bottom:10px; border-bottom:1px solid var(--border);}
tr.checklist-row td{color:var(--text-dim);}
tr.checklist-row .desc-cell{font-style:italic;}
tr.checklist-preview{opacity:.7;}

.mini-desempenho{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:18px;}
.hex-sm{width:38px; height:38px; font-size:15px;}
.mini-desempenho-info{flex:1; min-width:0;}
.mini-desempenho-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px;}
.mini-desempenho-top b{font-size:14px; font-family:'Rajdhani',sans-serif;}
.mini-desempenho-top span{font-size:13px; color:var(--amber); font-weight:700;}
.mini-desempenho .progress-bar{width:100%; max-width:none; height:6px; margin-top:0;}
.mini-desempenho-stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:7px; font-size:11px; color:var(--text-dim);}
.mini-desempenho-stats b{color:var(--text); font-weight:600;}
.cal-scroll-hint{display:none;}

@media(max-width:820px){
  .sidebar{position:fixed; z-index:30; height:100%; width:240px; transform:translateX(-100%); transition:.2s; box-shadow:8px 0 24px rgba(28,38,43,.12);}
  .sidebar.open{transform:translateX(0);}
  .main{padding:16px 14px 50px;}
  .menu-toggle{display:inline-flex !important;}
  .topbar h2{font-size:25px;}
  .topbar .badge-today{font-size:13px;}
  .grid-stats{grid-template-columns:repeat(2,1fr); gap:10px;}
  .stat-card{padding:13px 14px;}
  .stat-card .n{font-size:33px;}
  .pb-head{padding:12px 14px; flex-direction:column; align-items:flex-start; gap:2px;}
  th, td{padding:9px 12px;}
  .desc-cell{max-width:220px;}
  .rank-row{flex-wrap:wrap;}
  .progress-bar{width:100%; max-width:220px;}
  .login-card{padding:24px 20px 22px;}
  .login-brand h1{font-size:24px;}
  .sidebar-head{padding-bottom:12px; margin-bottom:10px;}
  .profile-card{padding:8px 9px;}
  .profile-avatar{width:30px; height:30px; font-size:16px;}
  .profile-info b{font-size:16px;}
  .profile-info span{font-size:13px;}
  .month-tabs{gap:5px;}
  .month-tab{padding:6px 11px; font-size:14px;}
  .task-card{padding:13px 14px;}
  .tc-meta{gap:10px; font-size:14px;}
  .assign-row, .mini-input, .mini-select{width:100%;}
  .mini-desempenho{padding:10px 12px; gap:10px; margin-bottom:14px;}
  .hex-sm{width:32px; height:32px; font-size:16px;}
  .mini-desempenho-top b{font-size:16px;}
  .mini-desempenho-top span{font-size:15px;}
  .mini-desempenho-stats{gap:9px; font-size:13px;}

  /* alvos de toque maiores */
  .profile-logout{width:38px; height:38px;}
  .menu-toggle{width:44px; height:44px; font-size:23px;}
  .btn-sm{padding:10px 15px; font-size:16px; min-height:38px;}
  .nav-item{padding:12px 12px; font-size:18px;}
  .assign-row .btn-sm{width:100%;}
  .topbar-logout{padding:9px 15px; font-size:16px; min-height:38px;}

  /* fontes ~25% maiores no mobile (itens sem override específico acima) */
  .bolt{font-size:33px;}
  .login-sub{font-size:16px;}
  .tab-btn{font-size:16px;}
  .field label{font-size:15px;}
  .field input, .field select{font-size:18px;}
  .btn-primary{font-size:18px;}
  .login-error{font-size:16px;}
  .login-hint{font-size:14px;}
  .sidebar-brand .bolt{font-size:25px;}
  .sidebar-brand span{font-size:19px;}
  .version-tag{font-size:13px;}
  .stat-card .l{font-size:14px;}
  .panel-box .pb-head h3{font-size:20px;}
  .panel-box .pb-head p{font-size:15px;}
  table{font-size:16px;}
  th{font-size:14px;}
  .os-tag{font-size:15px;}
  .status-pill{font-size:14px;}
  .mini-select, .mini-input{font-size:16px;}
  .field-row label{font-size:15px;}
  .empty-state{font-size:16px;}
  .hex{font-size:23px;}
  .rank-info b{font-size:25px;}
  .rank-info span{font-size:15px;}
  .task-card .tc-desc{font-size:18px;}
  .cal-table td.name-c{font-size:16px;}
  .toast{font-size:16px;}
  .leader-name{font-size:17px;}
  .notice{font-size:16px;}
  .prog-banner-brand .bolt{font-size:35px;}
  .prog-banner-brand b{font-size:19px;}
  .prog-banner-brand span{font-size:16px;}
  tr.turno-divider td{font-size:18px;}

  /* segundo plano fixo pode travar o scroll em Safari mobile */
  body{background-attachment:scroll;}

  /* --------- tabelas normais viram "cards" empilhados --------- */
  .stack-table{min-width:0;}
  .stack-table thead{position:absolute; left:-9999px; top:-9999px;}
  .stack-table tbody, .stack-table tr{display:block; width:100%;}
  .stack-table tr{border:1px solid var(--border); border-radius:8px; margin-bottom:10px; padding:4px 0; background:var(--panel);}
  .stack-table tr:hover td{background:transparent;}
  .stack-table td{display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:right; border-bottom:1px solid var(--border-soft); padding:9px 14px;}
  .stack-table tr td:last-child{border-bottom:none;}
  .stack-table td[data-label]::before{
    content:attr(data-label); text-align:left; font-size:13px; font-weight:600; color:var(--text-mute);
    text-transform:uppercase; letter-spacing:.04em; flex-shrink:0;
  }
  .stack-table td[colspan]{display:block; text-align:center; padding:12px 14px;}
  .stack-table td[colspan]::before{content:none;}
  .stack-table tr.turno-divider{border:none; border-radius:0; margin-bottom:0; background:none;}
  .stack-table tr.turno-divider td{display:block; text-align:left; border-bottom:none;}
  .stack-table td.desc-cell{display:block; max-width:none; text-align:left; white-space:normal;}
  .stack-table td.desc-cell::before{display:block; margin-bottom:5px;}

  /* --------- escala de folga: mantém grade, mas com coluna de nome fixa --------- */
  .cal-table th, .cal-table td{padding:6px 5px; font-size:13px; min-width:32px;}
  .cal-table td.name-c, .cal-table th:first-child{
    position:sticky; left:0; z-index:2; background:var(--panel);
    box-shadow:2px 0 4px rgba(28,38,43,.06);
  }
  .cal-table td.name-c{padding-right:10px;}
  .cal-scroll-hint{display:block; font-size:14px; color:var(--text-mute); padding:8px 14px 0; text-align:right;}
}
.sidebar-backdrop{display:none;}
@media(max-width:820px){
  .sidebar-backdrop.open{display:block; position:fixed; inset:0; background:rgba(28,38,43,.35); z-index:29;}
}
.menu-toggle{display:none; background:var(--panel-alt); border:1px solid var(--border); border-radius:6px; color:var(--text); width:36px; height:36px; align-items:center; justify-content:center; font-size:16px;}

/* =========================================================
   SKIN v2.1 — profundidade, cor com função e movimento
========================================================= */
:root{--ink:#16202A; --ink-2:#0E1116;}
@keyframes sk-glow{0%,100%{opacity:.42; transform:scale(1);} 50%{opacity:.86; transform:scale(1.07);}}
@keyframes sk-sweep{0%{transform:translateX(-140%);} 100%{transform:translateX(420%);}}
@keyframes sk-rise{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}
@keyframes sk-tick{0%{transform:scale(.4); opacity:0;} 60%{transform:scale(1.15);} 100%{transform:scale(1); opacity:1;}}

/* ---- LOGIN: topo escuro com brilho âmbar ---- */
.login-card{padding:0; overflow:hidden;}
.login-hero{position:relative; background:var(--ink); color:#fff; padding:34px 28px 30px; overflow:hidden;}
.login-hero::before{content:""; position:absolute; top:0; left:0; right:0; height:4px; z-index:2; background:repeating-linear-gradient(135deg, var(--amber) 0 10px, var(--ink-2) 10px 20px);}
.login-hero::after{
  content:""; position:absolute; width:230px; height:230px; border-radius:50%;
  background:var(--amber); filter:blur(72px); opacity:.45; top:-96px; right:-56px;
  animation:sk-glow 6.5s ease-in-out infinite; pointer-events:none;
}
.login-hero > *{position:relative; z-index:1;}
.login-hero .login-brand{gap:11px; margin-bottom:22px;}
.login-hero .bolt{
  width:42px; height:42px; border-radius:10px; background:var(--amber); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:21px;
  box-shadow:0 0 24px rgba(201,122,24,.6);
}
.login-hero h1{color:#fff; font-size:24px; letter-spacing:.03em; text-transform:uppercase;}
.login-title{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:30px; line-height:1.1;
  letter-spacing:.02em; text-transform:uppercase; margin:0 0 10px; color:#fff;}
.login-hero .login-sub{margin:0; font-size:12px; color:var(--amber-dim); letter-spacing:.1em;}
.login-body{padding:24px 28px 26px;}
.login-body .field input, .login-body .field select{padding:14px 12px; font-size:15px;}
.login-body .field input:focus, .login-body .field select:focus{box-shadow:0 0 0 4px rgba(201,122,24,.12);}
.btn-primary{
  position:relative; overflow:hidden; padding:15px 12px;
  box-shadow:0 3px 0 #A85F0E, 0 10px 22px rgba(201,122,24,.3);
}
.btn-primary::after{
  content:""; position:absolute; top:0; bottom:0; width:56px; background:rgba(255,255,255,.3);
  filter:blur(15px); animation:sk-sweep 3.6s ease-in-out infinite; pointer-events:none;
}
.btn-primary:active{transform:translateY(2px); box-shadow:0 1px 0 #A85F0E;}

/* ---- SIDEBAR escura ---- */
.sidebar{background:var(--ink); border-right:1px solid rgba(255,255,255,.08);}
.sidebar-brand{border-bottom-color:rgba(255,255,255,.12);}
.sidebar-brand span{color:#fff;}
.sidebar-head{border-bottom-color:rgba(255,255,255,.12);}
.profile-card{background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.1);}
.profile-info b{color:#fff;}
.profile-info span{color:var(--text-mute);}
.profile-logout{background:transparent; border-color:rgba(255,255,255,.16); color:var(--text-mute);}
.nav-item{color:var(--text-mute);}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(255,255,255,.07); color:var(--amber); box-shadow:inset 3px 0 0 var(--amber);}
.version-tag{color:#5B6B73;}

/* ---- CABEÇALHO E NÚMEROS ---- */
.topbar h2{font-size:32px;}
.stat-card .n{font-size:52px;}
.stat-card{transition:transform .15s, box-shadow .15s;}
.stat-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px rgba(28,38,43,.08);}
.stat-card.amber{background:var(--ink); border-color:var(--ink); overflow:hidden;}
.stat-card.amber::after{
  content:""; position:absolute; width:120px; height:120px; border-radius:50%; background:var(--amber);
  filter:blur(46px); opacity:.5; top:-56px; right:-30px; animation:sk-glow 6s ease-in-out infinite;
}
.stat-card.amber .n{color:var(--amber-dim); position:relative;}
.stat-card.amber .l{color:var(--text-mute); position:relative;}
.stat-card.red::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(135deg, rgba(209,74,59,.07) 0 6px, transparent 6px 12px);
}

/* ---- CARTÕES DE TAREFA ---- */
.task-card{border-left:3px solid var(--cyan); animation:sk-rise .38s ease both; box-shadow:0 2px 10px rgba(28,38,43,.06);}
.task-card:has(.status-atrasada){border-left-color:var(--red);}
.task-card:has(.status-aguardando_aprovacao){border-left-color:var(--amber);}
.task-card:has(.status-concluida){border-left-color:var(--green);}
.task-card .tc-foot .btn-sm{padding:13px 18px; font-size:13px; border-radius:7px;}
.task-card .tc-foot .btn-sm.green{background:var(--green); color:#fff; box-shadow:0 3px 0 #17784A;}
.task-card .tc-foot .btn-sm.green:hover{background:#17784A; transform:translateY(1px); box-shadow:0 2px 0 #12603B;}
.task-card .tc-foot .btn-sm.green:active{transform:translateY(3px); box-shadow:none;}

/* ---- PROGRESSO E NÍVEL ---- */
.progress-fill{
  background:repeating-linear-gradient(135deg, var(--amber) 0 8px, var(--amber-dim) 8px 16px);
  transition:width .7s cubic-bezier(.2,.8,.2,1);
}
.rank-info b{font-size:26px;}
.mini-desempenho{border-left:3px solid var(--amber);}

/* ---- TABELAS E FILA ---- */
.panel-box .pb-head h3{font-size:18px; letter-spacing:.03em; text-transform:uppercase;}
.leader-row.me{box-shadow:inset 3px 0 0 var(--amber);}
.leader-pts{font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700;}

/* ---- ESCALA (mantida) e TOASTS ---- */
.toast{animation:sk-rise .3s ease both;}
.toast.pos::before{content:"✔"; display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:50%; background:var(--green); color:#fff; font-size:11px;
  margin-right:8px; animation:sk-tick .45s cubic-bezier(.2,1.3,.4,1) both;}

@media(max-width:820px){
  .login-hero{padding:26px 20px 24px;}
  .login-body{padding:20px 20px 22px;}
  .login-title{font-size:26px;}
  .topbar h2{font-size:28px;}
  .stat-card .n{font-size:42px;}

  /* preserva o aumento de fontes no mobile onde a nova skin, sem media query,
     tinha prioridade sobre os ajustes de legibilidade já feitos antes */
  .login-hero .login-sub{font-size:14px;}
  .login-body .field input, .login-body .field select{font-size:18px;}
  .task-card .tc-foot .btn-sm{font-size:16px;}
  .panel-box .pb-head h3{font-size:20px;}
}
@media(prefers-reduced-motion:reduce){
  .login-hero::after, .btn-primary::after, .stat-card.amber::after{animation:none;}
  .task-card, .toast{animation:none;}
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-hero">
      <div class="login-brand"><span class="bolt">⚡</span><h1>Elétrica</h1></div>
      <p class="login-title">Painel de tarefas</p>
      <p class="login-sub mono">Agosto / 2026 · v2.1.0</p>
    </div>
    <div class="login-body">

    <div class="tabs">
      <button class="tab-btn active" id="tab-admin" onclick="switchLoginTab('admin')">Administrador</button>
      <button class="tab-btn" id="tab-colab" onclick="switchLoginTab('colab')">Colaborador</button>
    </div>

    <div id="login-admin-form">
      <div class="field">
        <label>Senha de administrador</label>
        <input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar como Admin</button>
    </div>

    <div id="login-colab-form" style="display:none;">
      <div class="field">
        <label>Selecione seu nome / matrícula</label>
        <select id="colab-select">
          <option value="">Selecione...</option>
        </select>
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
    </div>

    <p class="login-error" id="login-error">Senha incorreta.</p>
    <p class="login-hint">Os dados de equipe, tarefas, pontos e escala de folga ficam salvos no banco — atribuições e conclusões valem pra todo mundo, em qualquer dispositivo.</p>
    <p class="mono" style="text-align:center; font-size:10.5px; color:var(--text-mute); margin-top:14px;" id="login-version"></p>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-screen">
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="bolt">⚡</span><span>Elétrica</span></div>
      <div class="sidebar-head">
        <div class="profile-card">
          <div class="profile-avatar" id="profile-avatar">?</div>
          <div class="profile-info">
            <b id="profile-name">—</b>
            <span id="profile-role">—</span>
          </div>
          <button class="profile-logout" onclick="doLogout()" title="Sair"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></button>
        </div>
        <div class="version-tag mono" id="version-tag"></div>
      </div>
      <div id="nav-container"></div>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>
    <div class="main">
      <div class="main-header">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <button class="topbar-logout" onclick="doLogout()" title="Sair">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          <span>Sair</span>
        </button>
      </div>
      <div id="view-root"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */
// TODO: depois de publicar o backend no Render, troque pela URL real do serviço,
// por exemplo: "https://eletrica-portal-api.onrender.com"
const API_BASE = "https://eletrica-api.onrender.com";

const APP_VERSION = "v2.1.0";

/* =========================================================
   REGRAS DE GAMIFICAÇÃO (exibidas na UI — o cálculo oficial é feito no servidor)
========================================================= */
const PONTOS = {
  concluidaNoPrazo: 10,
  concluidaAtrasada: 3,
  naoCumprida: -5
};
// Régua pensada para: cumprindo tudo no prazo, todo dia útil, por 3 meses
// (~75 dias úteis x 20 pts/dia = 1500 pts) o colaborador chega a Diretor.
const RANKS = [
  {min:0,    label:"Jovem Aprendiz",       hex:"hex-1"},
  {min:40,   label:"Eletricista Jr.",      hex:"hex-2"},
  {min:90,   label:"Eletricista Pleno",    hex:"hex-3"},
  {min:160,  label:"Eletricista Sênior",   hex:"hex-4"},
  {min:250,  label:"Eletrotécnico Jr.",    hex:"hex-5"},
  {min:360,  label:"Eletrotécnico Pleno",  hex:"hex-6"},
  {min:500,  label:"Eletrotécnico Sênior", hex:"hex-7"},
  {min:650,  label:"Líder",                hex:"hex-8"},
  {min:820,  label:"Supervisor",           hex:"hex-9"},
  {min:1010, label:"Coordenador",          hex:"hex-10"},
  {min:1220, label:"Gerente",              hex:"hex-11"},
  {min:1500, label:"Diretor",              hex:"hex-12"}
];

/* =========================================================
   ESTADO (populado a partir da API)
========================================================= */
let users = [];          // colaboradores
let tasks = [];           // tarefas
let folgas = {};          // { matricula: ["YYYY-MM-DD", ...] }
let hojeISO = null;       // data de hoje, segundo o servidor
let session = null;       // {type:'admin', password} | {type:'colab', matricula}
let currentView = "overview";
let stateLoaded = false;
let programacaoData = null; // 'YYYY-MM-DD' selecionada na aba Programação do dia
let colabTarefasFiltro = 'abertas'; // 'abertas' | 'aguardando' | 'concluidas'
const TURNOS = ['A','B','C'];

/* =========================================================
   HELPERS
========================================================= */
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso+"T00:00:00").toLocaleDateString('pt-BR');
}
function fmtToday(){
  return hojeISO ? fmtDate(hojeISO) : '—';
}
function isFolga(matricula, dateStr){
  const arr = folgas[matricula];
  return !!(arr && arr.includes(dateStr));
}
function userByMat(m){ return users.find(u=>u.matricula===m); }
function rankOf(pontos){
  let r = RANKS[0];
  for(const item of RANKS){ if(pontos>=item.min) r=item; }
  return r;
}
function nextRank(pontos){
  return RANKS.find(r=>r.min>pontos) || null;
}
function firstName(fullName){
  if(!fullName) return '';
  const first = fullName.trim().split(/\s+/)[0];
  return first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
}
function addDays(dateStr, n){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function statusLabel(s){
  return {pendente:'Pendente',atribuida:'Em andamento',aguardando_aprovacao:'Aguardando aprovação',concluida:'Concluída',atrasada:'Atrasada'}[s] || s;
}
function toast(msg, positive){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (positive?'pos':'neg');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function openPicker(el){
  if(el.showPicker){ try{ el.showPicker(); }catch(e){} }
}

/* =========================================================
   API
========================================================= */
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if(!res.ok) throw new Error('Falha ao buscar ' + path);
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Erro na requisição.');
  return data;
}
async function loadState(){
  const data = await apiGet('/api/state');
  users = data.colaboradores;
  tasks = data.tarefas;
  folgas = data.folgas;
  hojeISO = data.hoje;
  stateLoaded = true;
}

/* =========================================================
   LOGIN
========================================================= */
function populateColabSelect(){
  const sel = document.getElementById('colab-select');
  sel.innerHTML = '<option value="">Selecione...</option>' +
    users.map(u=>`<option value="${u.matricula}">${firstName(u.nome)} — matrícula ${u.matricula}</option>`).join('');
}
function switchLoginTab(which){
  document.getElementById('tab-admin').classList.toggle('active', which==='admin');
  document.getElementById('tab-colab').classList.toggle('active', which==='colab');
  document.getElementById('login-admin-form').style.display = which==='admin' ? 'block':'none';
  document.getElementById('login-colab-form').style.display = which==='colab' ? 'block':'none';
  document.getElementById('login-error').style.display='none';
}
async function doLogin(){
  const isAdminTab = document.getElementById('tab-admin').classList.contains('active');
  const err = document.getElementById('login-error');
  const btns = document.querySelectorAll('.btn-primary');
  btns.forEach(b=>b.disabled=true);
  try{
    if(isAdminTab){
      const pass = document.getElementById('admin-pass').value;
      await apiPost('/api/admin/login', {password: pass});
      session = {type:'admin', password: pass};
    } else {
      const mat = document.getElementById('colab-select').value;
      if(!mat){ err.textContent='Selecione seu nome.'; err.style.display='block'; return; }
      session = {type:'colab', matricula:mat};
    }
    err.style.display='none';
    await loadState();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    currentView = session.type==='admin' ? 'overview' : 'minhas-tarefas';
    renderShell();
    const vt = document.getElementById('version-tag'); if(vt) vt.textContent = APP_VERSION;
    startPolling();
    connectRealtime();
  } catch(e){
    err.textContent = e.message || 'Não foi possível entrar. Tente novamente.';
    err.style.display='block';
  } finally {
    btns.forEach(b=>b.disabled=false);
  }
}
function doLogout(){
  stopPolling();
  disconnectRealtime();
  session=null;
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('admin-pass').value='';
  document.getElementById('colab-select').value='';
}

/* =========================================================
   SHELL / NAV
========================================================= */
const NAV_ADMIN = [
  {id:'overview', label:'Painel', icon:'▣'},
  {id:'tarefas', label:'Tarefas', icon:'☰'},
  {id:'aprovacoes', label:'Aprovações', icon:'✔'},
  {id:'programacao', label:'Programação do dia', icon:'▤'},
  {id:'nova-atividade', label:'Nova atividade', icon:'✚'},
  {id:'equipe', label:'Equipe', icon:'◈'},
  {id:'escala', label:'Escala de folga', icon:'▦'}
];
const NAV_COLAB = [
  {id:'minhas-tarefas', label:'Minhas tarefas', icon:'☰'},
  {id:'desempenho', label:'Meu desempenho', icon:'◈'},
  {id:'ranking', label:'Ranking geral', icon:'▣'}
];

function renderShell(){
  const nav = session.type==='admin' ? NAV_ADMIN : NAV_COLAB;
  document.getElementById('nav-container').innerHTML = nav.map(n=>
    `<button class="nav-item ${currentView===n.id?'active':''}" onclick="goView('${n.id}')"><span>${n.icon}</span>${n.label}</button>`
  ).join('');

  const avatar = document.getElementById('profile-avatar');
  const pname = document.getElementById('profile-name');
  const prole = document.getElementById('profile-role');
  if(session.type==='admin'){
    avatar.textContent = 'A';
    pname.textContent = 'Administrador';
    prole.textContent = 'Acesso total ao painel';
  } else {
    const u = userByMat(session.matricula);
    const fn = firstName(u.nome);
    avatar.textContent = fn.charAt(0);
    pname.textContent = fn;
    prole.textContent = rankOf(u.pontos).label;
  }
  render();
}
function goView(id){ currentView=id; toggleSidebar(false); renderShell(); }
function toggleSidebar(force){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  bd.classList.toggle('open', open);
}

/* =========================================================
   TEMPO REAL (Server-Sent Events)
   O backend avisa na hora quando alguém cria/atribui/conclui/aprova
   uma tarefa. O polling abaixo continua ligado, só que mais espaçado,
   como rede de segurança (ex.: se a conexão SSE cair e ainda não
   tiver reconectado).
========================================================= */
let eventSource = null;
function connectRealtime(){
  disconnectRealtime();
  if(!window.EventSource) return;
  eventSource = new EventSource(API_BASE + '/api/events');
  eventSource.onmessage = () => autoRefresh();
}
function disconnectRealtime(){
  if(eventSource){ eventSource.close(); eventSource = null; }
}

/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA (polling — rede de segurança)
========================================================= */
let pollTimer = null;
const POLL_MS = 45000;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(autoRefresh, POLL_MS);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
async function autoRefresh(){
  if(!session) return;
  const active = document.activeElement;
  const viewRoot = document.getElementById('view-root');
  const isEditing = active && viewRoot && viewRoot.contains(active) &&
    ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
  try{ await loadState(); } catch(e){ return; }
  if(!isEditing) render();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') autoRefresh();
});

/* =========================================================
   RENDER — router
========================================================= */
async function refreshAndRender(){
  try{ await loadState(); } catch(e){ toast('Não foi possível atualizar os dados.', false); }
  render();
}
function render(){
  const root = document.getElementById('view-root');
  if(session.type==='admin'){
    if(currentView==='overview') root.innerHTML = viewAdminOverview();
    else if(currentView==='tarefas') { root.innerHTML = viewAdminTarefas(); initTarefasSelects(); }
    else if(currentView==='aprovacoes') root.innerHTML = viewAdminAprovacoes();
    else if(currentView==='programacao') root.innerHTML = viewProgramacaoDia();
    else if(currentView==='nova-atividade') root.innerHTML = viewAdminNovaAtividade();
    else if(currentView==='equipe') root.innerHTML = viewAdminEquipe();
    else if(currentView==='escala') root.innerHTML = viewAdminEscala();
  } else {
    if(currentView==='minhas-tarefas') root.innerHTML = viewColabTarefas();
    else if(currentView==='desempenho') root.innerHTML = viewColabDesempenho();
    else if(currentView==='ranking') root.innerHTML = viewColabRanking();
  }
}

/* ---------- GERAR IMAGEM DA PROGRAMAÇÃO (canvas) ---------- */
// Réplica do template padrão usado no gerador Python (build_schedule.py):
// banda de logo/título, cabeçalho de colunas, e por turno um divisor + uma
// linha por colaborador (tarefas reais, "Check - list" ou "FOLGA").
const IMG_COLORS = {
  titleBand: '#F0A878',
  headerBg: '#E97132',
  rowDark: '#F6C7AB',
  rowLight: '#FCE2D5',
  white: '#FFFFFF',
  black: '#000000',
  border: '#BFBFBF',
  logoOrange: '#E97132'
};

function buildImagemTurnos(dataSel){
  const tarefasDoDia = tasks.filter(t=>t.scheduledDate===dataSel);
  return TURNOS.map((turno, idx)=>{
    const colabs = users.filter(u=>u.turno===turno);
    const rows = [];
    colabs.forEach(u=>{
      const nome = u.nome.trim().split(/\s+/)[0];
      if(isFolga(u.matricula, dataSel)){
        rows.push({nomes:[nome], os:'', descricao:'FOLGA'});
        return;
      }
      tarefasDoDia.filter(t=>t.matricula===u.matricula && !t.isChecklist).forEach(t=>{
        rows.push({nomes:[nome], os:t.os?String(t.os):'', descricao:t.descricao});
      });
      // Check-list é pré-programado pra todo mundo sem folga, independente de já existir no banco.
      rows.push({nomes:[nome], os:'', descricao:'Check - list'});
    });
    return {nome:'TURNO '+turno, withColumns: idx>0, rows};
  });
}

function wrapCanvasText(ctx, text, maxWidth){
  if(!text) return [''];
  const words = String(text).split(' ');
  const lines = [];
  let line = '';
  words.forEach(word=>{
    const test = line ? line+' '+word : word;
    if(line && ctx.measureText(test).width > maxWidth){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if(line) lines.push(line);
  return lines.length ? lines : [''];
}

async function renderProgramacaoCanvas(dataSel){
  if(document.fonts && document.fonts.ready) await document.fonts.ready;

  // Largura final com teto de 463px (padroniza a visualização em celular), mas
  // encolhe abaixo disso quando o conteúdo do dia não precisa de tudo isso —
  // evita coluna DESCRIÇÃO larga e vazia em dias com poucas tarefas. Fonte
  // monoespaçada compacta e linhas enxutas, igual ao gerador Python de
  // referência. Desenha em resolução bem maior (SUPERSAMPLE) e depois reamostra
  // pra um tamanho final EXPORT_SCALE vezes maior que a largura "lógica" —
  // exporta em alta resolução (nítido em tela de retina / zoom) mantendo as
  // mesmas proporções de layout.
  const SUPERSAMPLE = 4;
  const EXPORT_SCALE = 2;
  const MAX_W = 463, MIN_W = 320;
  const FONT_BODY = 9.5, LINE_H = 11.5, PAD_X = 4;
  const ROW_LOGO2_H = 13, ROW_HEADER_H = 15, ROW_DIVIDER_H = 15, ROW_MIN_H = 14;
  const BODY_FONT = "'IBM Plex Mono', monospace";
  const DISPLAY_FONT = "'Rajdhani', sans-serif";

  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = `${FONT_BODY}px ${BODY_FONT}`;

  const turnos = buildImagemTurnos(dataSel);

  // colunas TURNO e OS: só o necessário pro maior nome / código de OS do dia
  let nameW = mctx.measureText('TURNO').width;
  let osW = mctx.measureText('OS').width;
  turnos.forEach(t=> t.rows.forEach(r=>{
    r.nomes.forEach(n=> nameW = Math.max(nameW, mctx.measureText(n).width));
    if(r.os) osW = Math.max(osW, mctx.measureText(r.os).width);
  }));
  const COL_W = [
    Math.max(70, Math.round(nameW + PAD_X*2 + 4)),
    Math.max(30, Math.round(osW + PAD_X*2 + 4)),
    0
  ];

  // coluna DESCRIÇÃO: cabe a maior descrição do dia numa linha só até um teto;
  // além disso, quebra normalmente. Nunca deixa a imagem passar de MAX_W nem
  // ficar menor que MIN_W (pra banner/cabeçalho continuarem legíveis).
  let descNatural = mctx.measureText('DESCRIÇÃO').width;
  turnos.forEach(t=> t.rows.forEach(r=>{ descNatural = Math.max(descNatural, mctx.measureText(r.descricao).width); }));
  descNatural += PAD_X*2 + 4;
  const maxDescW = MAX_W - COL_W[0] - COL_W[1];
  const minDescW = Math.max(120, MIN_W - COL_W[0] - COL_W[1]);
  COL_W[2] = Math.max(minDescW, Math.min(maxDescW, Math.round(descNatural)));
  COL_W[2] = Math.max(80, Math.round(COL_W[2] * 0.7)); // 30% mais estreita

  const W = COL_W[0] + COL_W[1] + COL_W[2];

  // texto do banner institucional quebra em 2 linhas se a largura ficar
  // curta demais (a coluna Descrição mais estreita reduz a imagem toda)
  const bw = COL_W[1] + COL_W[2];
  mctx.font = `7.6px ${BODY_FONT}`;
  const bannerLines = wrapCanvasText(mctx, 'Manutenção Elétrica, Instrumentação, Automação', bw - 8);
  mctx.font = `${FONT_BODY}px ${BODY_FONT}`;
  const ROW_LOGO1_H = bannerLines.length > 1 ? 26 : 18;

  const drawRows = [];
  turnos.forEach(t=>{
    drawRows.push({type:'divider', nome:t.nome, withColumns:t.withColumns});
    t.rows.forEach(r=>{
      const dl = wrapCanvasText(mctx, r.descricao, COL_W[2]-PAD_X*2);
      const nLines = Math.max(dl.length, r.nomes.length);
      const h = Math.max(ROW_MIN_H, nLines*LINE_H + 3);
      drawRows.push({type:'data', row:r, descLinesArr:dl, height:h});
    });
  });

  const totalDataH = drawRows.reduce((s,r)=> s + (r.type==='data' ? r.height : ROW_DIVIDER_H), 0);
  const totalH = ROW_LOGO1_H + ROW_LOGO2_H + ROW_HEADER_H + totalDataH;

  const canvas = document.createElement('canvas');
  canvas.width = W*SUPERSAMPLE;
  canvas.height = totalH*SUPERSAMPLE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SUPERSAMPLE, SUPERSAMPLE);
  ctx.textBaseline = 'middle';

  function cellBorder(x,y,w,h){
    ctx.strokeStyle = IMG_COLORS.border;
    ctx.lineWidth = 1;
    ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);
  }
  function fillRect(x,y,w,h,color){ ctx.fillStyle = color; ctx.fillRect(x,y,w,h); }
  function setFont(opts){
    ctx.font = `${opts.bold?'bold ':''}${opts.size||FONT_BODY}px ${opts.font||BODY_FONT}`;
    ctx.fillStyle = opts.color || IMG_COLORS.black;
    ctx.textAlign = opts.align || 'left';
  }
  function drawText(text, x, y, w, h, opts){
    opts = opts||{};
    setFont(opts);
    const tx = opts.align==='center' ? x+w/2 : x+PAD_X;
    ctx.fillText(text, tx, y+h/2);
  }
  function drawMultiline(lines, x, y, w, h, opts){
    opts = opts||{};
    const lh = opts.lineHeight || LINE_H;
    setFont(opts);
    const tx = opts.align==='center' ? x+w/2 : x+PAD_X;
    let ty = y + h/2 - (lines.length*lh)/2 + lh/2;
    lines.forEach(l=>{ ctx.fillText(l, tx, ty); ty += lh; });
  }

  // banda de logo + título institucional
  fillRect(0,0, COL_W[0], ROW_LOGO1_H+ROW_LOGO2_H, IMG_COLORS.white);
  drawMultiline(['RRP','energia'], 0, 0, COL_W[0], ROW_LOGO1_H+ROW_LOGO2_H,
    {align:'center', color:IMG_COLORS.logoOrange, bold:true, size:11, font:DISPLAY_FONT, lineHeight:11.5});
  cellBorder(0,0,COL_W[0], ROW_LOGO1_H+ROW_LOGO2_H);

  const bx = COL_W[0];
  fillRect(bx, 0, bw, ROW_LOGO1_H, IMG_COLORS.titleBand);
  drawMultiline(bannerLines, bx, 0, bw, ROW_LOGO1_H, {align:'center', size:7.6, lineHeight:9});
  cellBorder(bx, 0, bw, ROW_LOGO1_H);

  fillRect(bx, ROW_LOGO1_H, bw, ROW_LOGO2_H, IMG_COLORS.titleBand);
  drawText(`Programação do dia    ${fmtDate(dataSel)}`, bx, ROW_LOGO1_H, bw, ROW_LOGO2_H, {align:'center', size:8, bold:true});
  cellBorder(bx, ROW_LOGO1_H, bw, ROW_LOGO2_H);

  let y = ROW_LOGO1_H + ROW_LOGO2_H;

  // cabeçalho de colunas
  const headers = ['TURNO','OS','DESCRIÇÃO'];
  let x = 0;
  headers.forEach((h,i)=>{
    fillRect(x, y, COL_W[i], ROW_HEADER_H, IMG_COLORS.headerBg);
    drawText(h, x, y, COL_W[i], ROW_HEADER_H, {align:'center', color:IMG_COLORS.white, bold:true});
    cellBorder(x, y, COL_W[i], ROW_HEADER_H);
    x += COL_W[i];
  });
  y += ROW_HEADER_H;

  let rowToggle = 0;
  drawRows.forEach(dr=>{
    if(dr.type==='divider'){
      const vals = dr.withColumns ? [dr.nome, 'OS', 'DESCRIÇÃO'] : [dr.nome, '', ''];
      let x2 = 0;
      vals.forEach((v,i)=>{
        fillRect(x2, y, COL_W[i], ROW_DIVIDER_H, IMG_COLORS.titleBand);
        drawText(v, x2, y, COL_W[i], ROW_DIVIDER_H, {align: i===0?'left':'center', bold:true});
        cellBorder(x2, y, COL_W[i], ROW_DIVIDER_H);
        x2 += COL_W[i];
      });
      y += ROW_DIVIDER_H;
      return;
    }
    const color = rowToggle % 2 === 0 ? IMG_COLORS.rowDark : IMG_COLORS.rowLight;
    rowToggle++;
    const r = dr.row, h = dr.height;
    let x3 = 0;
    fillRect(x3, y, COL_W[0], h, color);
    drawMultiline(r.nomes, x3, y, COL_W[0], h, {});
    cellBorder(x3, y, COL_W[0], h);
    x3 += COL_W[0];
    fillRect(x3, y, COL_W[1], h, color);
    drawText(r.os, x3, y, COL_W[1], h, {align:'center'});
    cellBorder(x3, y, COL_W[1], h);
    x3 += COL_W[1];
    fillRect(x3, y, COL_W[2], h, color);
    drawMultiline(dr.descLinesArr, x3, y, COL_W[2], h, {});
    cellBorder(x3, y, COL_W[2], h);
    y += h;
  });

  // reamostra do canvas em altíssima resolução (SUPERSAMPLE) para o tamanho
  // final em EXPORT_SCALE — arquivo com o dobro dos pixels do "tamanho lógico",
  // nítido em tela de retina e no zoom, mesmas proporções de layout de antes
  // (equivalente ao render 300dpi -> crop -> resize LANCZOS do gerador Python)
  const final = document.createElement('canvas');
  final.width = Math.round(W*EXPORT_SCALE);
  final.height = Math.round(totalH*EXPORT_SCALE);
  const fctx = final.getContext('2d');
  fctx.imageSmoothingEnabled = true;
  fctx.imageSmoothingQuality = 'high';
  fctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, final.width, final.height);
  return final;
}

async function gerarImagemProgramacao(){
  const dataSel = programacaoData || hojeISO;
  try{
    const canvas = await renderProgramacaoCanvas(dataSel);
    const dataUrl = canvas.toDataURL('image/png');
    abrirModalImagem(dataUrl, `programacao_${dataSel}.png`);
  } catch(e){
    console.error(e);
    toast('Não foi possível gerar a imagem.', false);
  }
}

function abrirModalImagem(dataUrl, filename){
  const existente = document.querySelector('.img-modal-backdrop');
  if(existente) existente.remove();
  const wrap = document.createElement('div');
  wrap.className = 'img-modal-backdrop';
  wrap.innerHTML = `
    <div class="img-modal">
      <div class="img-modal-head">
        <b>Programação do dia</b>
        <button class="img-modal-close" onclick="this.closest('.img-modal-backdrop').remove()" title="Fechar">✕</button>
      </div>
      <div class="img-modal-body"><img src="${dataUrl}" alt="Imagem da programação do dia"></div>
      <div class="img-modal-foot"><a class="btn-primary img-modal-download" href="${dataUrl}" download="${filename}">Baixar imagem</a></div>
    </div>`;
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  document.body.appendChild(wrap);
}

async function criarAtividade(){
  const osInput = document.getElementById('nova-os');
  const descInput = document.getElementById('nova-desc');
  const osVal = osInput.value.trim();
  const descVal = descInput.value.trim();
  if(!descVal){ toast('Descreva a atividade antes de salvar.', false); return; }
  const osNum = osVal ? parseInt(osVal,10) : null;
  if(osVal && Number.isNaN(osNum)){ toast('Número da OS/SS inválido — use só números.', false); return; }
  try{
    await apiPost('/api/tasks', { os: osNum, descricao: descVal, adminPassword: session.password });
    toast('Atividade adicionada à lista de tarefas.', true);
    osInput.value=''; descInput.value='';
    await refreshAndRender();
    goView('tarefas');
  } catch(e){
    toast(e.message || 'Não foi possível salvar a atividade.', false);
  }
}

/* ---------- ADMIN: ESCALA ---------- */
let escalaMesSelecionado = null; // 'YYYY-MM' — controla qual mês está aberto na aba Escala

function mesesDisponiveis(){
  const set = new Set();
  Object.values(folgas).flat().forEach(iso => set.add(iso.slice(0,7)));
  return Array.from(set).sort();
}
const NOMES_MES = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function setEscalaMes(mes){ escalaMesSelecionado = mes; render(); }

function viewAdminEscala(){
  const meses = mesesDisponiveis();
  if(!escalaMesSelecionado || !meses.includes(escalaMesSelecionado)){
    const mesHoje = hojeISO ? hojeISO.slice(0,7) : null;
    escalaMesSelecionado = meses.includes(mesHoje) ? mesHoje : (meses[0] || (hojeISO ? hojeISO.slice(0,7) : '2026-08'));
  }
  const refMonth = escalaMesSelecionado;
  const [ano, mes] = refMonth.split('-').map(Number);
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const dias = Array.from({length:diasNoMes}, (_,i)=>i+1);
  return `
    <div class="topbar"><h2>Escala de folga</h2><span class="badge-today mono">Hoje: ${fmtToday()}</span></div>
    ${meses.length>1 ? `<div class="month-tabs">${meses.map(m=>{
      const [a,mm]=m.split('-').map(Number);
      return `<button class="month-tab ${m===refMonth?'active':''}" onclick="setEscalaMes('${m}')">${NOMES_MES[mm]} · ${a}</button>`;
    }).join('')}</div>` : ''}
    <div class="panel-box">
      <div class="pb-head"><div><h3>Calendário da equipe — ${NOMES_MES[mes]}/${ano}</h3><p>Dias marcados em âmbar = folga. Colaborador não recebe tarefa nesses dias.</p></div></div>
      <span class="cal-scroll-hint">← arraste para o lado para ver todos os dias →</span>
      <div class="pb-body cal-wrap">
        <table class="cal-table">
          <thead><tr><th class="day-h" style="text-align:left">Colaborador</th>${dias.map(d=>`<th class="day-h">${d}</th>`).join('')}</tr></thead>
          <tbody>
          ${users.map(u=>{
            const arr = folgas[u.matricula]||[];
            return `<tr><td class="name-c">${firstName(u.nome)}</td>${dias.map(d=>{
              const iso = `${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
              const f = arr.includes(iso);
              return `<td class="${f?'f-cell':''}">${f?'F':''}</td>`;
            }).join('')}</tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ---------- COLAB: MINHAS TAREFAS ---------- */
function miniDesempenho(u){
  const r = rankOf(u.pontos);
  const nr = nextRank(u.pontos);
  const progress = nr ? Math.min(100, Math.round(((u.pontos - r.min) / (nr.min - r.min))*100)) : 100;
  return `
    <div class="mini-desempenho">
      <div class="hex hex-sm ${r.hex}">⚡</div>
      <div class="mini-desempenho-info">
        <div class="mini-desempenho-top"><b>${r.label}</b><span class="mono">${u.pontos} pts</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        <div class="mini-desempenho-stats">
          <span><b class="mono">${u.concluidas}</b> concluídas</span>
          <span><b class="mono">${u.atrasadas}</b> atrasadas</span>
          <span>${nr ? (nr.min-u.pontos)+' pts p/ '+nr.label : 'Nível máximo'}</span>
        </div>
      </div>
    </div>
  `;
}
function setColabFiltro(f){ colabTarefasFiltro = f; render(); }
function viewColabTarefas(){
  const u = userByMat(session.matricula);
  const minhas = tasks.filter(t=>t.matricula===session.matricula);
  const abertas = minhas.filter(t=>t.status==='atribuida'||t.status==='atrasada');
  const aguardando = minhas.filter(t=>t.status==='aguardando_aprovacao');
  const concluidas = minhas.filter(t=>t.status==='concluida');
  const FILTROS = [
    {id:'abertas', label:'Abertas', list:abertas},
    {id:'aguardando', label:'Aguardando aprovação', list:aguardando},
    {id:'concluidas', label:'Concluídas', list:concluidas}
  ];
  const ativo = FILTROS.find(f=>f.id===colabTarefasFiltro) || FILTROS[0];

  function renderCards(list, comBotao){
    return list.map(t=>`
      <div class="task-card">
        <div class="tc-top">
          <span class="os-tag">${t.os ? '#'+t.os : 'Sem nº de OS'}</span>
          <span class="status-pill status-${t.status}">${statusLabel(t.status)}</span>
        </div>
        <p class="tc-desc">${t.descricao}</p>
        <div class="tc-meta"><span>Programada: <b>${fmtDate(t.scheduledDate)}</b></span><span>Prazo final: <b>${fmtDate(t.dueDate)}</b></span></div>
        <div class="tc-foot">${comBotao
          ? `<button class="btn-sm green" onclick="completeTask(${t.id})">Marcar como concluída</button>`
          : `<span style="font-size:12px; color:var(--text-dim);">Aguardando revisão do administrador.</span>`}</div>
      </div>
    `).join('');
  }
  function renderConcluidasTable(list){
    return `
      <div class="panel-box">
        <div class="pb-body">
          <table class="stack-table">
            <thead><tr><th style="width:70px">OS</th><th>Descrição</th><th>Programada</th><th>Prazo</th><th>Concluída em</th></tr></thead>
            <tbody>
            ${list.map(t=>`<tr>
              <td class="os-tag" data-label="OS">${t.os?'#'+t.os:'—'}</td>
              <td class="desc-cell" data-label="Descrição">${t.descricao}</td>
              <td class="mono" data-label="Programada">${fmtDate(t.scheduledDate)}</td>
              <td class="mono" data-label="Prazo">${fmtDate(t.dueDate)}</td>
              <td class="mono" data-label="Concluída em">${fmtDate(t.completedDate)}</td>
            </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }

  let conteudo;
  if(ativo.list.length===0){
    conteudo = `<div class="empty-state">Nenhuma tarefa nesse filtro.</div>`;
  } else if(ativo.id==='concluidas'){
    conteudo = renderConcluidasTable(ativo.list);
  } else {
    conteudo = renderCards(ativo.list, ativo.id==='abertas');
  }

  return `
    <div class="topbar"><h2>Minhas tarefas</h2><span class="badge-today mono">Hoje: ${fmtToday()}</span></div>
    ${miniDesempenho(u)}
    ${minhas.length===0 ? `<div class="notice">Você ainda não tem tarefas atribuídas. Assim que o administrador te programar, elas aparecem aqui.</div>` : `
      <div class="month-tabs">
        ${FILTROS.map(f=>`<button class="month-tab ${f.id===ativo.id?'active':''}" onclick="setColabFiltro('${f.id}')">${f.label} (${f.list.length})</button>`).join('')}
      </div>
      ${conteudo}
    `}
  `;
}
async function completeTask(taskId){
  try{
    await apiPost(`/api/tasks/${taskId}/complete`, {matricula: session.matricula});
    toast('Enviada para aprovação do administrador. Os pontos são creditados após a aprovação.', true);
    await refreshAndRender();
    renderShell();
  } catch(e){
    toast(e.message || 'Não foi possível concluir a tarefa.', false);
  }
}
