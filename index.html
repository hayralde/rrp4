<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elétrica — Painel de Tarefas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F6;
  --panel:#FFFFFF;
  --panel-alt:#EEF1F3;
  --border:#D9E0E4;
  --border-soft:#E7ECEE;
  --amber:#C97A18;
  --amber-dim:#E0A24A;
  --green:#1E9A5D;
  --red:#D14A3B;
  --cyan:#1C7FA3;
  --text:#1C262B;
  --text-dim:#5B6B73;
  --text-mute:#8A9AA2;
  --on-accent:#231604;
  --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background-image:
    linear-gradient(var(--border-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size:34px 34px;
  background-attachment:fixed;
}
h1,h2,h3,.disp{font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:'Inter',sans-serif; cursor:pointer;}
::selection{background:var(--amber); color:#fff;}

/* ---------- LOGIN ---------- */
#login-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.login-card{
  width:100%; max-width:420px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:32px 30px 28px;
  position:relative;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(28,38,43,.08);
}
.login-card::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:4px;
  background:repeating-linear-gradient(135deg, var(--amber) 0 10px, #1C262B 10px 20px);
}
.login-brand{display:flex; align-items:center; gap:10px; margin-bottom:4px;}
.bolt{color:var(--amber); font-size:26px; line-height:1;}
.login-brand h1{font-size:22px; margin:0; color:var(--text);}
.login-sub{color:var(--text-dim); font-size:13px; margin:0 0 24px; letter-spacing:.03em; text-transform:uppercase;}
.tabs{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:22px;}
.tab-btn{
  flex:1; padding:10px 8px; background:var(--panel-alt); color:var(--text-dim);
  border:none; font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
  transition:.15s;
}
.tab-btn.active{background:var(--amber); color:#fff;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em;}
.field input, .field select{
  width:100%; padding:11px 12px; background:var(--bg); border:1px solid var(--border);
  border-radius:6px; color:var(--text); font-size:14px; font-family:'IBM Plex Mono',monospace;
}
.field input:focus, .field select:focus{outline:none; border-color:var(--amber);}
.btn-primary{
  width:100%; padding:12px; border:none; border-radius:6px; background:var(--amber); color:#fff;
  font-weight:700; font-size:14px; letter-spacing:.03em; text-transform:uppercase; margin-top:6px;
}
.btn-primary:hover{filter:brightness(1.08);}
.login-error{color:var(--red); font-size:12.5px; margin-top:10px; display:none;}
.login-hint{font-size:11.5px; color:var(--text-mute); margin-top:18px; line-height:1.5; border-top:1px dashed var(--border); padding-top:14px;}

/* ---------- APP SHELL ---------- */
#app-screen{display:none; min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
  padding:20px 14px; display:flex; flex-direction:column;
}
.sidebar-brand{display:flex; align-items:center; gap:8px; padding:0 6px 20px; border-bottom:1px solid var(--border); margin-bottom:16px;}
.sidebar-brand .bolt{font-size:20px;}
.sidebar-brand span{font-size:15px; font-weight:700; font-family:'Rajdhani',sans-serif;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; color:var(--text-dim);
  font-size:13.5px; font-weight:600; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:var(--panel-alt); color:var(--text);}
.nav-item.active{background:var(--panel-alt); color:var(--amber); box-shadow:inset 3px 0 0 var(--amber);}
.sidebar-head{padding-bottom:14px; margin-bottom:12px; border-bottom:1px solid var(--border);}
.profile-card{display:flex; align-items:center; gap:10px; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px; padding:9px 10px;}
.profile-avatar{
  width:34px; height:34px; border-radius:50%; flex-shrink:0;
  background:linear-gradient(145deg,var(--amber),#9a6414); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px;
}
.profile-info{flex:1; min-width:0;}
.profile-info b{display:block; font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.3;}
.profile-info span{display:block; font-size:11px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.profile-logout{
  width:28px; height:28px; flex-shrink:0; border-radius:6px; border:1px solid var(--border);
  background:var(--panel); color:var(--text-dim); font-size:14px; display:flex; align-items:center; justify-content:center;
}
.profile-logout:hover{color:var(--red); border-color:var(--red); background:rgba(209,74,59,.08);}
.version-tag{text-align:center; margin-top:8px; font-size:10px; color:var(--text-mute);}

.main{flex:1; padding:26px 32px 60px; min-width:0;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.topbar h2{margin:0; font-size:24px;}
.topbar .badge-today{font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; border:1px solid var(--border); padding:5px 10px; border-radius:20px;}

.grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:26px;}
.stat-card{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px 18px; position:relative; overflow:hidden;}
.stat-card .n{font-family:'Rajdhani',sans-serif; font-size:32px; font-weight:700; line-height:1;}
.stat-card .l{font-size:11.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:6px;}
.stat-card.amber .n{color:var(--amber);}
.stat-card.green .n{color:var(--green);}
.stat-card.red .n{color:var(--red);}
.stat-card.cyan .n{color:var(--cyan);}

.panel-box{background:var(--panel); border:1px solid var(--border); border-radius:8px; margin-bottom:22px; overflow:hidden;}
.panel-box .pb-head{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;}
.panel-box .pb-head h3{margin:0; font-size:16px;}
.panel-box .pb-head p{margin:2px 0 0; font-size:12px; color:var(--text-dim);}
.pb-body{padding:6px 0; overflow-x:auto;}

table{width:100%; min-width:560px; border-collapse:collapse; font-size:13px;}
th{text-align:left; padding:9px 18px; color:var(--text-mute); font-size:11px; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--border); font-weight:600;}
td{padding:11px 18px; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,0,0,.02);}
.os-tag{font-family:'IBM Plex Mono',monospace; color:var(--cyan); font-size:12px;}
.desc-cell{max-width:420px; color:var(--text);}

.status-pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.status-pendente{background:rgba(91,107,115,.14); color:var(--text-dim);}
.status-atribuida{background:rgba(28,127,163,.14); color:var(--cyan);}
.status-concluida{background:rgba(30,154,93,.14); color:var(--green);}
.status-atrasada{background:repeating-linear-gradient(135deg, rgba(209,74,59,.16) 0 6px, rgba(209,74,59,.05) 6px 12px); color:var(--red);}

.mini-select, .mini-input{
  background:var(--bg); border:1px solid var(--border); color:var(--text); font-size:12.5px;
  padding:6px 8px; border-radius:5px; font-family:'IBM Plex Mono',monospace;
}
input[type="date"]{
  color-scheme:light;
  cursor:pointer;
}
input[type="date"]::-webkit-calendar-picker-indicator{
  filter:invert(40%) sepia(60%) saturate(900%) hue-rotate(1deg) brightness(0.95);
  cursor:pointer;
  padding:2px;
}
input[type="date"]:hover{border-color:var(--amber);}
.mini-select option:disabled{color:var(--text-mute);}
.btn-sm{padding:7px 13px; border-radius:5px; border:1px solid var(--amber); background:transparent; color:var(--amber); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
.btn-sm:hover{background:var(--amber); color:#fff;}
.btn-sm:disabled{opacity:.35; cursor:not-allowed; border-color:var(--border); color:var(--text-mute);}
.btn-sm.green{border-color:var(--green); color:var(--green);}
.btn-sm.green:hover{background:var(--green); color:#fff;}
.btn-sm.red{border-color:var(--red); color:var(--red);}
.btn-sm.red:hover{background:var(--red); color:#fff;}
.assign-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.field-row label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}

.empty-state{padding:34px 18px; text-align:center; color:var(--text-mute); font-size:13px;}

/* rank hex badge */
.hex{
  width:52px; height:52px; position:relative;
  clip-path:polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px;
}
.hex-1{background:linear-gradient(145deg,#8896A0,#5C6B73); color:#F4F6F7;}
.hex-2{background:linear-gradient(145deg,#4FA97A,#1E7A50); color:#F0FFF6;}
.hex-3{background:linear-gradient(145deg,#3F9FC4,#1C6E8C); color:#EEFAFF;}
.hex-4{background:linear-gradient(145deg,#E0A24A,#B87418); color:#FFF6E8;}
.hex-5{background:linear-gradient(145deg,#F0C86A,#C9791A); color:#FFFBEF;}

.rank-row{display:flex; align-items:center; gap:16px;}
.rank-info b{font-size:20px; font-family:'Rajdhani',sans-serif; display:block;}
.rank-info span{font-size:12px; color:var(--text-dim);}
.progress-bar{background:var(--bg); border:1px solid var(--border); border-radius:20px; height:9px; width:220px; overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--amber),#c98a2e);}

.task-card{border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-bottom:12px; background:var(--panel);}
.task-card .tc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px;}
.task-card .tc-desc{font-size:14px; line-height:1.45; color:var(--text); margin:0 0 8px;}
.task-card .tc-meta{display:flex; gap:16px; font-size:12px; color:var(--text-dim); flex-wrap:wrap;}
.task-card .tc-meta b{color:var(--text);}
.task-card .tc-foot{display:flex; justify-content:flex-end; margin-top:10px;}

.cal-wrap{overflow-x:auto;}
.month-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.month-tab{padding:7px 13px; border-radius:20px; border:1px solid var(--border); background:var(--panel); color:var(--text-dim); font-size:12px; font-weight:600;}
.month-tab:hover{border-color:var(--amber); color:var(--text);}
.month-tab.active{background:var(--amber); border-color:var(--amber); color:#fff;}
.cal-table th, .cal-table td{padding:6px 8px; text-align:center; font-size:11px;}
.cal-table th.day-h{color:var(--text-mute); font-weight:500;}
.cal-table td.name-c{text-align:left; font-family:'Inter'; font-size:12.5px; color:var(--text); white-space:nowrap; padding-right:16px;}
.f-cell{color:var(--amber); font-weight:700; background:rgba(201,122,24,.10);}

.toast-wrap{position:fixed; top:20px; right:20px; z-index:50; display:flex; flex-direction:column; gap:8px;}
.toast{
  padding:12px 16px; border-radius:7px; background:var(--panel); border:1px solid var(--border);
  font-size:13px; min-width:220px; box-shadow:0 8px 22px rgba(28,38,43,.14);
  animation:slidein .25s ease-out;
}
.toast.pos{border-left:3px solid var(--green);}
.toast.neg{border-left:3px solid var(--red);}
@keyframes slidein{from{transform:translateX(14px); opacity:0;} to{transform:translateX(0); opacity:1;}}

.leader-row{display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--border-soft);}
.leader-row:last-child{border-bottom:none;}
.leader-pos{font-family:'IBM Plex Mono',monospace; color:var(--text-mute); width:22px;}
.leader-name{flex:1; font-size:13.5px;}
.leader-pts{font-family:'IBM Plex Mono',monospace; color:var(--amber); font-weight:600;}
.leader-row.me{background:rgba(201,122,24,.08);}

.notice{background:var(--panel-alt); border:1px solid var(--border); border-left:3px solid var(--cyan); border-radius:6px; padding:12px 16px; font-size:12.5px; color:var(--text-dim); margin-bottom:20px; line-height:1.5;}

@media(max-width:820px){
  .sidebar{position:fixed; z-index:30; height:100%; width:240px; transform:translateX(-100%); transition:.2s; box-shadow:8px 0 24px rgba(28,38,43,.12);}
  .sidebar.open{transform:translateX(0);}
  .main{padding:16px 14px 50px;}
  .menu-toggle{display:inline-flex !important; margin-bottom:14px;}
  .topbar h2{font-size:20px;}
  .topbar .badge-today{font-size:10.5px;}
  .grid-stats{grid-template-columns:repeat(2,1fr); gap:10px;}
  .stat-card{padding:13px 14px;}
  .stat-card .n{font-size:26px;}
  .pb-head{padding:12px 14px; flex-direction:column; align-items:flex-start; gap:2px;}
  th, td{padding:9px 12px;}
  .desc-cell{max-width:220px;}
  .rank-row{flex-wrap:wrap;}
  .progress-bar{width:100%; max-width:220px;}
  .login-card{padding:24px 20px 22px;}
  .login-brand h1{font-size:19px;}
  .cal-table th, .cal-table td{padding:5px 6px; font-size:10px;}
  .sidebar-head{padding-bottom:12px; margin-bottom:10px;}
  .profile-card{padding:8px 9px;}
  .profile-avatar{width:30px; height:30px; font-size:13px;}
  .profile-info b{font-size:12.5px;}
  .profile-info span{font-size:10.5px;}
  .month-tabs{gap:5px;}
  .month-tab{padding:6px 11px; font-size:11px;}
  .task-card{padding:13px 14px;}
  .tc-meta{gap:10px; font-size:11px;}
  .assign-row, .mini-input, .mini-select{width:100%;}
}
.sidebar-backdrop{display:none;}
@media(max-width:820px){
  .sidebar-backdrop.open{display:block; position:fixed; inset:0; background:rgba(28,38,43,.35); z-index:29;}
}
.menu-toggle{display:none; background:var(--panel-alt); border:1px solid var(--border); border-radius:6px; color:var(--text); width:36px; height:36px; align-items:center; justify-content:center; font-size:16px;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand"><span class="bolt">⚡</span><h1>Elétrica</h1></div>
    <p class="login-sub">Painel de tarefas — Agosto/2026</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-admin" onclick="switchLoginTab('admin')">Administrador</button>
      <button class="tab-btn" id="tab-colab" onclick="switchLoginTab('colab')">Colaborador</button>
    </div>

    <div id="login-admin-form">
      <div class="field">
        <label>Senha de administrador</label>
        <input type="password" id="admin-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar como Admin</button>
    </div>

    <div id="login-colab-form" style="display:none;">
      <div class="field">
        <label>Selecione seu nome / matrícula</label>
        <select id="colab-select">
          <option value="">Selecione...</option>
        </select>
      </div>
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
    </div>

    <p class="login-error" id="login-error">Senha incorreta.</p>
    <p class="login-hint">Os dados de equipe, tarefas, pontos e escala de folga ficam salvos no banco — atribuições e conclusões valem pra todo mundo, em qualquer dispositivo.</p>
    <p class="mono" style="text-align:center; font-size:10.5px; color:var(--text-mute); margin-top:14px;" id="login-version"></p>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-screen">
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="bolt">⚡</span><span>Elétrica</span></div>
      <div class="sidebar-head">
        <div class="profile-card">
          <div class="profile-avatar" id="profile-avatar">?</div>
          <div class="profile-info">
            <b id="profile-name">—</b>
            <span id="profile-role">—</span>
          </div>
          <button class="profile-logout" onclick="doLogout()" title="Sair"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg></button>
        </div>
        <div class="version-tag mono" id="version-tag"></div>
      </div>
      <div id="nav-container"></div>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar(false)"></div>
    <div class="main">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div id="view-root"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */
// TODO: depois de publicar o backend no Render, troque pela URL real do serviço,
// por exemplo: "https://eletrica-portal-api.onrender.com"
const API_BASE = "https://eletrica-api.onrender.com";

const APP_VERSION = "v2.0.0";

/* =========================================================
   REGRAS DE GAMIFICAÇÃO (exibidas na UI — o cálculo oficial é feito no servidor)
========================================================= */
const PONTOS = {
  concluidaNoPrazo: 10,
  concluidaAtrasada: 3,
  naoCumprida: -5
};
const RANKS = [
  {min:0,   label:"Aprendiz",          hex:"hex-1"},
  {min:20,  label:"Eletricista Jr.",   hex:"hex-2"},
  {min:50,  label:"Eletricista Pleno", hex:"hex-3"},
  {min:100, label:"Eletricista Sênior",hex:"hex-4"},
  {min:200, label:"Mestre Elétrico",   hex:"hex-5"}
];

/* =========================================================
   ESTADO (populado a partir da API)
========================================================= */
let users = [];          // colaboradores
let tasks = [];           // tarefas
let folgas = {};          // { matricula: ["YYYY-MM-DD", ...] }
let hojeISO = null;       // data de hoje, segundo o servidor
let session = null;       // {type:'admin', password} | {type:'colab', matricula}
let currentView = "overview";
let stateLoaded = false;

/* =========================================================
   HELPERS
========================================================= */
function fmtDate(iso){
  if(!iso) return '—';
  return new Date(iso+"T00:00:00").toLocaleDateString('pt-BR');
}
function fmtToday(){
  return hojeISO ? fmtDate(hojeISO) : '—';
}
function isFolga(matricula, dateStr){
  const arr = folgas[matricula];
  return !!(arr && arr.includes(dateStr));
}
function userByMat(m){ return users.find(u=>u.matricula===m); }
function rankOf(pontos){
  let r = RANKS[0];
  for(const item of RANKS){ if(pontos>=item.min) r=item; }
  return r;
}
function nextRank(pontos){
  return RANKS.find(r=>r.min>pontos) || null;
}
function firstName(fullName){
  if(!fullName) return '';
  const first = fullName.trim().split(/\s+/)[0];
  return first.charAt(0).toUpperCase() + first.slice(1).toLowerCase();
}
function addDays(dateStr, n){
  const d = new Date(dateStr+"T00:00:00");
  d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function statusLabel(s){
  return {pendente:'Pendente',atribuida:'Em andamento',concluida:'Concluída',atrasada:'Atrasada'}[s] || s;
}
function toast(msg, positive){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (positive?'pos':'neg');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function openPicker(el){
  if(el.showPicker){ try{ el.showPicker(); }catch(e){} }
}

/* =========================================================
   API
========================================================= */
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if(!res.ok) throw new Error('Falha ao buscar ' + path);
  return res.json();
}
async function apiPost(path, body){
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Erro na requisição.');
  return data;
}
async function loadState(){
  const data = await apiGet('/api/state');
  users = data.colaboradores;
  tasks = data.tarefas;
  folgas = data.folgas;
  hojeISO = data.hoje;
  stateLoaded = true;
}

function populateColabSelect(){
  const sel = document.getElementById('colab-select');
  sel.innerHTML = '<option value="">Selecione...</option>' +
    users.map(u=>`<option value="${u.matricula}">${firstName(u.nome)} — matrícula ${u.matricula}</option>`).join('');
}
function switchLoginTab(which){
  document.getElementById('tab-admin').classList.toggle('active', which==='admin');
  document.getElementById('tab-colab').classList.toggle('active', which==='colab');
  document.getElementById('login-admin-form').style.display = which==='admin' ? 'block':'none';
  document.getElementById('login-colab-form').style.display = which==='colab' ? 'block':'none';
  document.getElementById('login-error').style.display='none';
}
async function doLogin(){
  const isAdminTab = document.getElementById('tab-admin').classList.contains('active');
  const err = document.getElementById('login-error');
  const btns = document.querySelectorAll('.btn-primary');
  btns.forEach(b=>b.disabled=true);
  try{
    if(isAdminTab){
      const pass = document.getElementById('admin-pass').value;
      await apiPost('/api/admin/login', {password: pass});
      session = {type:'admin', password: pass};
    } else {
      const mat = document.getElementById('colab-select').value;
      if(!mat){ err.textContent='Selecione seu nome.'; err.style.display='block'; return; }
      session = {type:'colab', matricula:mat};
    }
    err.style.display='none';
    await loadState();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='block';
    currentView = session.type==='admin' ? 'overview' : 'minhas-tarefas';
    renderShell();
    const vt = document.getElementById('version-tag'); if(vt) vt.textContent = APP_VERSION;
  } catch(e){
    err.textContent = e.message || 'Não foi possível entrar. Tente novamente.';
    err.style.display='block';
  } finally {
    btns.forEach(b=>b.disabled=false);
  }
}
function doLogout(){
  session=null;
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('admin-pass').value='';
  document.getElementById('colab-select').value='';
}

   RENDER — router
========================================================= */
async function refreshAndRender(){
  try{ await loadState(); } catch(e){ toast('Não foi possível atualizar os dados.', false); }
  render();
}
function render(){
  const root = document.getElementById('view-root');
  if(session.type==='admin'){
    if(currentView==='overview') root.innerHTML = viewAdminOverview();
    else if(currentView==='tarefas') { root.innerHTML = viewAdminTarefas(); initTarefasSelects(); }
    else if(currentView==='nova-atividade') root.innerHTML = viewAdminNovaAtividade();
    else if(currentView==='equipe') root.innerHTML = viewAdminEquipe();
    else if(currentView==='escala') root.innerHTML = viewAdminEscala();
  } else {
    if(currentView==='minhas-tarefas') root.innerHTML = viewColabTarefas();
    else if(currentView==='desempenho') root.innerHTML = viewColabDesempenho();
    else if(currentView==='ranking') root.innerHTML = viewColabRanking();
  }
}

function initTarefasSelects(){
  tasks.filter(t=>t.status==='pendente').forEach(t=>refreshColabOptions(t.id));
}
function refreshColabOptions(taskId){
  const dateInput = document.getElementById('sched-'+taskId);
  const sel = document.getElementById('colab-'+taskId);
  if(!dateInput || !sel) return;
  const date = dateInput.value;
  const prevValue = sel.value;
  sel.innerHTML = users.map(u=>{
    const folga = isFolga(u.matricula, date);
    return `<option value="${u.matricula}" ${folga?'disabled':''}>${firstName(u.nome)}${folga?' — FOLGA':''}</option>`;
  }).join('');
  if(prevValue) sel.value = prevValue;
}
function onSchedChange(taskId){
  const sched = document.getElementById('sched-'+taskId).value;
  const duePreview = document.getElementById('due-preview-'+taskId);
  if(duePreview) duePreview.textContent = fmtDate(addDays(sched,2));
  refreshColabOptions(taskId);
}
async function assignTask(taskId){
  const sched = document.getElementById('sched-'+taskId).value;
  const mat = document.getElementById('colab-'+taskId).value;
  if(!sched){ toast('Escolha a data de programação.', false); return; }
  if(!mat){ toast('Escolha um colaborador.', false); return; }
  try{
    const result = await apiPost(`/api/tasks/${taskId}/assign`, {
      matricula: mat, scheduledDate: sched, adminPassword: session.password
    });
    const nome = firstName(userByMat(mat).nome);
    if(result.scheduledDate !== sched){
      toast(`${nome} já tem 2 tarefas nesse período — reagendada para ${fmtDate(result.scheduledDate)} (prazo ${fmtDate(result.dueDate)})`, true);
    } else {
      toast(`Tarefa atribuída a ${nome} — prazo ${fmtDate(result.dueDate)}`, true);
    }
    await refreshAndRender();
  } catch(e){
    toast(e.message || 'Não foi possível atribuir a tarefa.', false);
  }
}

async function resetarDistribuicao(){
  const ok = confirm('Isso vai voltar TODAS as tarefas para "pendente" (sem responsável, sem datas) e zerar os pontos/estatísticas de todos os colaboradores. Essa ação não pode ser desfeita. Confirma?');
  if(!ok) return;
  try{
    await apiPost('/api/tasks/reset', { adminPassword: session.password });
    toast('Distribuição resetada — todas as tarefas voltaram a pendente.', true);
    await refreshAndRender();
  } catch(e){
    toast(e.message || 'Não foi possível resetar a distribuição.', false);
  }
}

/* ---------- ADMIN: ESCALA ---------- */
let escalaMesSelecionado = null; // 'YYYY-MM' — controla qual mês está aberto na aba Escala

function mesesDisponiveis(){
  const set = new Set();
  Object.values(folgas).flat().forEach(iso => set.add(iso.slice(0,7)));
  return Array.from(set).sort();
}
const NOMES_MES = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function setEscalaMes(mes){ escalaMesSelecionado = mes; render(); }

function viewAdminEscala(){
  const meses = mesesDisponiveis();
  if(!escalaMesSelecionado || !meses.includes(escalaMesSelecionado)){
    const mesHoje = hojeISO ? hojeISO.slice(0,7) : null;
    escalaMesSelecionado = meses.includes(mesHoje) ? mesHoje : (meses[0] || (hojeISO ? hojeISO.slice(0,7) : '2026-08'));
  }
  const refMonth = escalaMesSelecionado;
  const [ano, mes] = refMonth.split('-').map(Number);
  const diasNoMes = new Date(ano, mes, 0).getDate();
  const dias = Array.from({length:diasNoMes}, (_,i)=>i+1);
  return `
    <div class="topbar"><h2>Escala de folga</h2><span class="badge-today mono">Hoje: ${fmtToday()}</span></div>
    ${meses.length>1 ? `<div class="month-tabs">${meses.map(m=>{
      const [a,mm]=m.split('-').map(Number);
      return `<button class="month-tab ${m===refMonth?'active':''}" onclick="setEscalaMes('${m}')">${NOMES_MES[mm]} · ${a}</button>`;
    }).join('')}</div>` : ''}
    <div class="panel-box">
      <div class="pb-head"><div><h3>Calendário da equipe — ${NOMES_MES[mes]}/${ano}</h3><p>Dias marcados em âmbar = folga. Colaborador não recebe tarefa nesses dias.</p></div></div>
      <div class="pb-body cal-wrap">
        <table class="cal-table">
          <thead><tr><th class="day-h" style="text-align:left">Colaborador</th>${dias.map(d=>`<th class="day-h">${d}</th>`).join('')}</tr></thead>
          <tbody>
          ${users.map(u=>{
            const arr = folgas[u.matricula]||[];
            return `<tr><td class="name-c">${firstName(u.nome)}</td>${dias.map(d=>{
              const iso = `${ano}-${String(mes).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
              const f = arr.includes(iso);
              return `<td class="${f?'f-cell':''}">${f?'F':''}</td>`;
            }).join('')}</tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

    <div class="grid-stats">
      <div class="stat-card green"><div class="n">${u.concluidas}</div><div class="l">Tarefas concluídas</div></div>
      <div class="stat-card red"><div class="n">${u.atrasadas}</div><div class="l">Tarefas atrasadas</div></div>
      <div class="stat-card amber"><div class="n">${u.pontos}</div><div class="l">Pontos totais</div></div>
    </div>
    <div class="notice">Como pontuar: concluir até o prazo final = +${PONTOS.concluidaNoPrazo} pts · concluir depois do prazo = +${PONTOS.concluidaAtrasada} pts · deixar passar o prazo sem concluir = ${PONTOS.naoCumprida} pts.</div>
  `;
}

/* ---------- COLAB: RANKING ---------- */
function viewColabRanking(){
  const ranked = [...users].sort((a,b)=>b.pontos-a.pontos);
  return `
    <div class="topbar"><h2>Ranking geral</h2><span class="badge-today mono">Hoje: ${fmtToday()}</span></div>
    <div class="panel-box">
      <div class="pb-head"><div><h3>Classificação do mês</h3></div></div>
      <div class="pb-body">
        ${ranked.map((u,i)=>`
          <div class="leader-row ${u.matricula===session.matricula?'me':''}">
            <span class="leader-pos mono">#${i+1}</span>
            <span class="leader-name">${firstName(u.nome)}${u.matricula===session.matricula?' (você)':''}</span>
            <span class="leader-pts">${u.pontos} pts</span>
          </div>`).join('')}
      </div>
    </div>
  `;
}

/* =========================================================
   INIT
========================================================= */
async function init(){
  document.getElementById('login-version').textContent = APP_VERSION;
  try{
    await loadState();
    populateColabSelect();
  } catch(e){
    document.getElementById('login-error').textContent = 'Não foi possível conectar ao servidor. Verifique se a API está no ar.';
    document.getElementById('login-error').style.display = 'block';
  }
}
init();

</script>

</html>
